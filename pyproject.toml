[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten-digit-gan"
version = "0.2.0"
description = "A PyTorch DCGAN implementation trained on MNIST to generate handwritten digits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
digit-gan-train = "digit_gan.train:main"
digit-gan-sample = "digit_gan.sample:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that need network access (deselected by default)",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
